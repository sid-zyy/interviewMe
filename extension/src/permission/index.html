<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Enable microphone — interviewMe</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0f13;
        --card: #1a1c22;
        --border: rgba(255, 255, 255, 0.08);
        --text: #eceef3;
        --muted: #a3a9b6;
        --accent: linear-gradient(135deg, #9aa8ff 0%, #b58cf0 100%);
        --ok: #6fd49a;
        --bad: #f2877f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f6f7fb;
          --card: #fff;
          --border: rgba(15, 20, 40, 0.08);
          --text: #141722;
          --muted: #545b6b;
          --ok: #1f9d5c;
          --bad: #d64545;
        }
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        text-align: center;
        max-width: 380px;
        padding: 32px 28px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: #0e0f13;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #0e0f13;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </div>
      <h1>Microphone access</h1>
      <div id="status"><p>Requesting microphone access…</p></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
